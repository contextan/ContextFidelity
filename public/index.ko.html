<!DOCTYPE html><html class="light" lang="ko"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Inter:wght@100..900&amp;family=JetBrains+Mono:wght@100..900&amp;display=swap" rel="stylesheet"><title>ContextFidelity · Chat</title><link rel="stylesheet" href="/styles.css"><script src="/app.ko.js" defer></script></head><body class="bg-slate-50 text-slate-900 font-body-md text-body-md min-h-screen">
<aside id="app-sidebar" aria-label="프로젝트와 대화" class="app-sidebar fixed left-0 top-0 h-full bg-white border-r border-slate-200 z-50 flex flex-col">
<div class="sidebar-brand"><a id="brand-link" href="/" class="flex items-center gap-2 text-slate-900 font-semibold text-lg"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>ContextFidelity</span></a></div>
<div class="sidebar-project"><button id="project-switch" class="w-full flex items-center justify-between rounded-lg border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-left"><span id="project-name" class="truncate">프로젝트 선택</span><span class="material-symbols-outlined text-slate-400 text-[18px]">unfold_more</span></button></div>
<div class="sidebar-new-chat-wrap"><button id="new-chat" class="sidebar-new-chat w-full px-3 py-2.5 rounded-lg bg-indigo-600 text-white text-sm font-medium flex items-center justify-center gap-2"><span class="material-symbols-outlined text-[18px]">add</span><span>새 대화</span></button></div>
<section class="sidebar-history" aria-labelledby="session-list-heading">
  <h2 id="session-list-heading" class="sidebar-section-label">최근 대화</h2>
  <div id="session-list" class="sidebar-session-list" aria-label="대화 목록"></div>
</section>
<div class="sidebar-footer">
    <button type="button" id="settings-tab" data-page="settings" aria-label="설정" title="설정" class="sidebar-settings-tab"><span class="material-symbols-outlined">tune</span><span>설정</span></button>
</div>
</aside>
<button id="sidebar-backdrop" type="button" aria-label="사이드바 닫기" class="sidebar-backdrop" tabindex="-1"></button>
<div class="app-main"><header class="app-header fixed top-0 right-0 h-16 bg-white/95 backdrop-blur-md border-b border-slate-200 z-40 px-5 flex items-center justify-between gap-3">
  <div class="header-primary flex items-center gap-3 min-w-0">
<button id="sidebar-toggle" type="button" aria-label="대화 목록 열기" aria-controls="app-sidebar" aria-expanded="false" class="sidebar-toggle"><span class="material-symbols-outlined">menu</span></button>
    <nav id="primary-tabs" class="primary-tabs" aria-label="주요 화면">
      <button data-page="chat" aria-label="채팅" class="top-tab"><span class="material-symbols-outlined">chat_bubble</span><span class="top-tab-label">채팅</span></button>
      <button data-page="contexts" aria-label="컨텍스트 관리" class="top-tab"><span class="material-symbols-outlined">library_books</span><span class="top-tab-label">컨텍스트 관리</span></button>
      <button data-page="inspector" aria-label="답변 기록" class="top-tab"><span class="material-symbols-outlined">difference</span><span class="top-tab-label">답변 기록</span></button>
    </nav>
  </div>
  <div class="header-meta flex items-center gap-3 min-w-0">
    <span id="workspace-name" class="text-slate-700 text-xs truncate"></span>
    <span id="header-topics" class="hidden lg:inline text-indigo-700 text-xs truncate max-w-52"></span>
    <button type="button" id="context-panel-toggle" data-action="toggle-context-panel" aria-expanded="false" aria-controls="chat-context-drawer" class="hidden context-panel-toggle"><span class="material-symbols-outlined">tune</span><span class="context-toggle-label">컨텍스트</span></button>
  </div>
</header><main id="view" class="pt-16 min-h-screen"></main></div>
<div id="toast" role="status" class="hidden fixed bottom-6 right-6 z-[80] bg-slate-900 text-white rounded-lg px-4 py-3 max-w-lg shadow-lg"></div>
</body></html>
