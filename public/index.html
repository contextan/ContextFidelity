<!DOCTYPE html><html class="light" lang="en"><head><meta charset="utf-8"><meta content="width=device-width, initial-scale=1.0" name="viewport"><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=Inter:wght@100..900&amp;family=JetBrains+Mono:wght@100..900&amp;display=swap" rel="stylesheet"><title>ContextPulse · Chat</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head><body class="bg-slate-50 text-slate-900 font-body-md text-body-md min-h-screen">
<aside class="app-sidebar fixed left-0 top-0 h-full w-60 bg-white border-r border-slate-200 z-50 flex flex-col">
<div class="px-5 py-6"><a id="brand-link" href="/" class="flex items-center gap-2 text-slate-900 font-semibold text-lg"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span class="sidebar-label">ContextPulse</span></a></div>
<div class="px-3 mb-5"><button id="project-switch" class="w-full flex items-center justify-between rounded-lg border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-left"><span class="sidebar-label">Select project</span><span class="material-symbols-outlined text-slate-400 text-[18px]">unfold_more</span></button></div>
<nav class="px-3 flex flex-col gap-1" aria-label="Main navigation">
<button data-page="chat" aria-label="Chat" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-600 text-left"><span class="material-symbols-outlined text-[20px]">chat_bubble</span><span class="sidebar-label">Chat</span></button>
<button data-page="contexts" aria-label="Context manager" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-600 text-left"><span class="material-symbols-outlined text-[20px]">library_books</span><span class="sidebar-label">Context manager</span></button>
<button data-page="inspector" aria-label="Answer records" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-600 text-left"><span class="material-symbols-outlined text-[20px]">difference</span><span class="sidebar-label">Answer records</span></button>
<button data-page="settings" aria-label="Settings" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-slate-600 text-left"><span class="material-symbols-outlined text-[20px]">tune</span><span class="sidebar-label">Settings</span></button>
</nav>
<div class="mt-auto border-t border-slate-100 p-4 sidebar-label"><a id="language-switch" href="/ko" class="block text-xs text-indigo-700 underline mb-3">English</a><p id="sidebar-model" class="truncate text-xs text-slate-700">Model not connected</p><p class="text-xs text-slate-400 mt-1"><span id="sidebar-provider"></span> · Records retained in server storage</p></div>
</aside>
<div class="app-main pl-60"><header class="app-header fixed top-0 left-60 right-0 h-16 bg-white/95 backdrop-blur-md border-b border-slate-200 z-40 px-6 flex items-center justify-between gap-3"><div class="flex items-center gap-3 min-w-0"><span id="workspace-name" class="text-slate-900 font-semibold truncate">Chat</span><span id="header-topics" class="hidden md:inline text-indigo-700 text-xs"></span></div><div class="flex items-center gap-3"><button type="button" id="connection-badge" data-action="settings" class="text-xs text-slate-500 underline underline-offset-4">Connect a model</button><button id="new-chat" class="px-3 py-2 rounded-lg bg-indigo-600 text-white text-sm font-medium flex items-center gap-1"><span class="material-symbols-outlined text-[16px]">add</span>New conversation</button></div></header><main id="view" class="pt-16 min-h-screen"></main></div>
<div id="toast" role="status" class="hidden fixed bottom-6 right-6 z-[80] bg-slate-900 text-white rounded-lg px-4 py-3 max-w-lg shadow-lg"></div>
</body></html>
